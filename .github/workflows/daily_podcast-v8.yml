name: Daily Podcast Agent (V8 - Telegram Stable)

on:
  schedule:
    # Twice Daily Cron Schedule (Times based on South Africa Standard Time SAST - UTC+2)
    # Morning update at 06:00 SAST (04:00 AM UTC)
    - cron: '0 4 * * *'
    # Evening update at 18:00 SAST (04:00 PM UTC / 16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch:
    # Allows you to manually trigger the podcast generation on GitHub at any time

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai gtts

    - name: Run Podcast Generation Agent
      env:
        # Secure API Key stored in your GitHub Repository Secrets
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        
        # User-specified topics of interest (comma-separated, no spaces around commas)
        NEWS_TOPICS: "South African Economy,Global Economy,ZAR Exchange Rate,Technology,Artificial Intelligence,Interest Rate in South Africa,Property Sector,Commodity prices,Brent Crude Oil,Gold Price,Silver Price,South African Companies,Johannesburg Stock Exchange JSE,South African Property Industry,Shopping Centre Developments South Africa,Arsenal Football Club"
        
        # Number of articles fetched per topic
        MAX_ARTICLES: 6
        
        # Set to "openai" for realistic voices (requires API key) or "gtts" (free, basic voice)
        TTS_PROVIDER: "openai"
        
        # Selected voice style (alloy, echo, fable, onyx, nova, shimmer)
        OPENAI_TTS_VOICE: "onyx"
      run: |
        python news_agent-v2.py

    - name: Send Briefing to Telegram
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Locate the compiled files
        MP3_FILE=$(ls *.mp3 | head -n 1)
        TXT_FILE=$(ls *.txt | head -n 1)
        
        if [ -z "$MP3_FILE" ] || [ -z "$TXT_FILE" ]; then
          echo "❌ Error: Could not find generated audio or transcript files!"
          exit 1
        fi
        
        echo "📤 Sending files to Telegram chat..."
        
        # 1. Send the status header text (using proper -X POST HTTP method)
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "text=🎙️ *Your Daily Podcast Briefing is Ready!* 🎙️%0A%0AHere is today's 10-15 minute audio update and written transcript. Stream it directly below:" \
          -d "parse_mode=Markdown"
          
        # 2. Send the written transcript as a file (using proper -X POST HTTP method)
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
          -F "chat_id=${CHAT_ID}" \
          -F "document=@${TXT_FILE}"
          
        # 3. Send the audio file (using proper -X POST HTTP method)
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendAudio" \
          -F "chat_id=${CHAT_ID}" \
          -F "audio=@${MP3_FILE}" \
          -F "title=Daily Briefing" \
          -F "performer=Daily News Agent"
          
        echo "🎉 Successfully dispatched to your iPhone!"
