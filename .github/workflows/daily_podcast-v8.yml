name: Daily Podcast Agent (V10 - Expanded Multi-Source News)

on:
  schedule:
    # Twice Daily Cron Schedule (Times based on South Africa Standard Time SAST - UTC+2)
    # Morning update at 06:00 SAST (04:00 AM UTC)
    - cron: '0 4 * * *'
    # Evening update at 18:00 SAST (04:00 PM UTC / 16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch:
    # Allows you to manually trigger the podcast generation on GitHub at any time

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai gtts

    - name: Run Podcast Generation Agent
      env:
        # Secure API Key stored in your GitHub Repository Secrets
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        # User-specified topics of interest (comma-separated, no spaces around commas)
        NEWS_TOPICS: "South African Economy,Global Economy,ZAR Exchange Rate,Technology,Artificial Intelligence,Interest Rate in South Africa,Property Sector,Commodity prices,Brent Crude Oil,Gold Price,Silver Price,South African Companies,Johannesburg Stock Exchange JSE,South African Property Industry,Shopping Centre Developments South Africa,Arsenal Football Club"

        # Per-query article limit used by the underlying Google/GDELT collectors
        MAX_ARTICLES: 6

        # V4 expanded-news controls
        GOOGLE_QUERY_VARIANTS: 3
        GDELT_QUERY_VARIANTS: 2
        CANDIDATE_ARTICLES_PER_TOPIC: 14
        FINAL_ARTICLES_PER_TOPIC: 8
        MAX_PER_PUBLISHER: 2
        NEWS_FETCH_WORKERS: 6
        USE_AI_NEWS_SELECTION: "true"
        AI_SELECTED_PER_TOPIC: 6

        # Long-form script length controls
        MIN_SCRIPT_WORDS: 2200
        TARGET_SCRIPT_WORDS: 2600
        MAX_EXPANSION_PASSES: 2

        # OpenAI speech configuration
        TTS_PROVIDER: "openai"
        OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
        OPENAI_TTS_VOICE: "cedar"
        OPENAI_TTS_INSTRUCTIONS: "Speak like an energetic, polished financial-news narrator. Sound confident, alert and engaging without becoming theatrical. Use crisp pronunciation, natural emphasis on important figures, and a slightly brisk but comfortable broadcast pace."
      run: |
        python news_agent-v4.py

    - name: Send Briefing to Telegram
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Locate the compiled files
        MP3_FILE=$(ls *.mp3 | head -n 1)
        TXT_FILE=$(ls *.txt | head -n 1)

        if [ -z "$MP3_FILE" ] || [ -z "$TXT_FILE" ]; then
          echo "❌ Error: Could not find generated audio or transcript files!"
          exit 1
        fi

        echo "📤 Sending files to Telegram chat..."

        # 1. Send the status header text
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "text=🎙️ *Your Daily Podcast Briefing is Ready!* 🎙️%0A%0AHere is today's 15-20 minute multi-source audio update and written transcript, including the latest available exchange rates and commodity prices. Stream it directly below:" \
          -d "parse_mode=Markdown"

        # 2. Send the written transcript as a file
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
          -F "chat_id=${CHAT_ID}" \
          -F "document=@${TXT_FILE}"

        # 3. Send the audio file
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendAudio" \
          -F "chat_id=${CHAT_ID}" \
          -F "audio=@${MP3_FILE}" \
          -F "title=Daily Briefing" \
          -F "performer=Daily News Agent"

        echo "🎉 Successfully dispatched to your iPhone!"
